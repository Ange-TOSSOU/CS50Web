<!DOCTYPE html>
<html lang="en">
    <head>
        <title>My Web Page!</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    </head>
    <style>
        .row > div {
            padding: 20px;
            background-color: teal;
            border: 2px solid black;
        }
    </style>
    <body>
        <div class="container">
            <div class="row">
                <div class="col-3">
                    This is a section.
                </div>
                <div class="col-3">
                    This is another section.
                </div>
                <div class="col-3">
                    This is a third section.
                </div>
                <div class="col-3">
                    This is a fourth section.
                </div>
            </div>
        </div>

        <div class="container">
            <div class="row">
                <div class="col-3">
                    This is a section.
                </div>
                <div class="col-6">
                    This is another section.
                </div>
                <div class="col-3">
                    This is a third section.
                </div>
            </div>
        </div>

        <div class="container">
            <div class="row">
                <div class="lg:col-3 sm:col-6">
                    This is a section.
                </div>
                <div class="lg:col-3 sm:col-6">
                    This is another section.
                </div>
                <div class="lg:col-3 sm:col-6">
                    This is a third section.
                </div>
                <div class="lg:col-3 sm:col-6">
                    This is a fourth section.
                </div>
            </div>
        </div>
    </body>
</html>
